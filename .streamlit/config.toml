# Streamlit Community Cloud reads this file automatically.

[theme]
base = "light"
primaryColor = "#2166ac"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f5f7"
textColor = "#1b1f23"

[server]
# The app has no file upload, so keep the limit small.
maxUploadSize = 5
enableXsrfProtection = true

[browser]
gatherUsageStats = false
